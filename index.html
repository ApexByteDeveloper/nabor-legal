<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabor Market - Conecta con tu Comunidad</title>
    <style>
        :root {
            --primary: #2A6F97;
            --secondary: #014F86;
            --dark: #1A1A1A;
            --light: #F8F9FA;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
        header { background-color: var(--primary); color: white; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .hero { text-align: center; padding: 5rem 1rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto; }
        .badge { background: white; color: var(--secondary); padding: 0.75rem 1.5rem; border-radius: 50px; text-decoration: none; font-weight: bold; }
        footer { background-color: var(--dark); color: white; text-align: center; padding: 2rem 1rem; font-size: 0.9rem; }
        footer a { color: #A9D6E5; text-decoration: none; margin: 0 10px; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Nabor Market</div>
    </header>

    <section class="hero">
        <h1>Tu mercado local al alcance de tus manos</h1>
        <p>Conecta con negocios, productos y servicios dentro de tu comunidad de forma rápida, segura y confiable.</p>
        <a href="#" class="badge">Próximamente en App Store & Play Store</a>
    </section>

    <footer>
        <p>&copy; 2026 ApexByte. Todos los derechos reservados.</p>
        <p style="margin-top: 10px;">
            <a href="privacy.html">Política de Privacidad</a> | 
            <a href="terms.html">Términos de Servicio</a>
        </p>
    </footer>

</body>
</html>
